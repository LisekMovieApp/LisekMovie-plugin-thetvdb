[package]
name = "lisek-plugin-thetvdb"
description = "TheTVDB metadata provider extension for LisekMovie."
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
lisek-plugin-api = { path = "../LisekMovie-app/LisekMovie-Backend/lisek-plugin-api" }
async-trait = "0.1.89"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
